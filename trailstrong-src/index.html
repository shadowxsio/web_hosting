<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TrailStrong 2026</title>
    <meta name="description" content="Application privée de renforcement pour coureurs." />
    <!-- Application privée : ni indexation, ni aperçu, ni cache des moteurs de recherche. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#1d1830" />
    <!-- Thème appliqué avant le premier rendu (fichier externe : compatible CSP) -->
    <script src="./theme.js"></script>
    <!-- Polices embarquées (pas d'appel à Google, disponibles hors-ligne) : préchargées pour le 1er affichage. -->
    <link rel="preload" href="/src/assets/fonts/karla.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrailStrong" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
