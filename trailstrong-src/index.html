<html lang="fr">
  <head>

    <title>TrailStrong 2026</title>
    <meta name="description" content="Application privée de renforcement pour coureurs." />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Thème appliqué avant le premier rendu (fichier externe : compatible CSP) -->
    <script src="./theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400..800;1,400..800&family=Shrikhand&display=swap" rel="stylesheet" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrailStrong" />
  </head>
