    bullets:
      - fr: "Architecture GCP : Administration de l'organisation GCP (nombreux projets actifs, multiples équipes). Gestion centralisée des Org Policies, IAM, activation des APIs clients. Conception de Landing Zones conformes aux exigences bancaires."
        en: "GCP Architecture: Management of the GCP organization (many active projects, multiple teams). Centralized Org Policies, IAM and client API activation. Design of Landing Zones compliant with banking requirements."
      - fr: "Réseau & Sécurité : Architecture Hub & Spoke avec Interconnect (plusieurs VPCs). Mise en place VPC-SC (périmètres de sécurité), Shared VPC, Serverless VPC Access. Suivi conformité CIS Benchmark. Sécurité réseau Zero-Trust."
