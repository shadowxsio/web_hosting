  summary:
    fr: "Ingénieur Cloud & DevOps senior avec plus de 10 ans d'expérience en infrastructures IT, dont 6 ans spécialisé en Cloud (GCP, Alibaba Cloud) et Kubernetes. Expert en conception et administration de plateformes cloud à grande échelle : architecture réseau Hub & Spoke, sécurité (VPC-SC, IAM, CIS Benchmark), CI/CD (GitHub Actions, Jenkins, Concourse), IaC (Terraform, CDKTF, Ansible) et observabilité (Prometheus, Grafana, ELK). Expérience en environnements critiques : banque (Desjardins), santé publique (TousAntiCovid), agroalimentaire. Certifié Google Associate Cloud Engineer. Résident permanent du Canada."
    en: "Senior Cloud & DevOps Engineer with 10+ years of IT infrastructure experience, including 6 years specializing in Cloud (GCP, Alibaba Cloud) and Kubernetes. Expert in designing and operating large-scale cloud platforms: Hub & Spoke network architecture, security (VPC-SC, IAM, CIS Benchmark), CI/CD (GitHub Actions, Jenkins, Concourse), IaC (Terraform, CDKTF, Ansible) and observability (Prometheus, Grafana, ELK). Proven track record in critical environments: banking (Desjardins), public health (TousAntiCovid), agrifood. Google Associate Cloud Engineer certified. Canadian Permanent Resident."

