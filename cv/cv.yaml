      - fr: "IaC : Terraform (gestion de nombreuses ressources), configuration via tfvars et YAML. Modules CDKTF pour l'abstraction. Terraform Cloud pour gestion d'état, collaboration et gouvernance modulaire."
        en: "IaC: Terraform (many resources managed), configuration via tfvars and YAML. CDKTF modules for abstraction. Terraform Cloud for state management, collaboration and modular governance."
      - fr: "Observabilité : Dashboards Cloud Monitoring/Logging, alerting personnalisé, suivi SLO/SLA. Intégration WIZ pour la posture de sécurité cloud."
        en: "Observability: Cloud Monitoring/Logging dashboards, custom alerting, SLO/SLA tracking. WIZ integration for cloud security posture."
      - fr: "Opérations : Méthodologie Agile (Sprints 2 semaines), astreintes 24/7, stabilisation et amélioration continue de la production."
        en: "Operations: Agile methodology (2-week sprints), 24/7 on-call, production stabilization and continuous improvement."
    env: "GCP (VPC-SC, Cloud Run, GKE, IAM, Interconnect, LB, GCS, Cloud Monitoring), Terraform, Terraform Cloud, CDKTF, GitHub Actions, Concourse, WIZ, Jira"

