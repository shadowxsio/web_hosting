name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_run:
    workflows: ["Fetch Latest Runs"]
    types:
      - completed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Translate CV to Bilingual JSON
        run: |
          python3 scripts/translate_cv.py
      - name: Generate PDF Resumes (French and English)
        run: |
          python3 -m http.server 8000 &
          SERVER_PID=$!
          sleep 3
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=cv/cv_fr.pdf "http://localhost:8000/cv/index.html?lang=fr"
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=cv/cv_en.pdf "http://localhost:8000/cv/index.html?lang=en"
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=cv/cv_ats_fr.pdf "http://localhost:8000/cv/ats.html?lang=fr"
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=cv/cv_ats_en.pdf "http://localhost:8000/cv/ats.html?lang=en"
          kill $SERVER_PID
      # ── TrailStrong 2026 (PWA Vite/React) → publié sous /trailstrong/ ──
      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: trailstrong-src/package-lock.json
      - name: Install & build TrailStrong 🏔️
        working-directory: trailstrong-src
        env:
          # Optionnel : SHA-256 hex du PIN (secret du dépôt). Sans secret → PIN par défaut « 2026 ».
          VITE_APP_PASSWORD_HASH: ${{ secrets.APP_PASSWORD_HASH }}
          # Connexion Google sans serveur : client OAuth + email(s) autorisé(s) (variable ou secret, au choix).
          # Sans ces deux valeurs, l'app reste en accès PIN uniquement.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          ALLOWED_GOOGLE_EMAIL: ${{ secrets.ALLOWED_GOOGLE_EMAIL || vars.ALLOWED_GOOGLE_EMAIL }}
          # Comptes multi-utilisateurs (Firebase) : valeurs publiques par conception.
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
          # Les dépendances ne doivent pas partir dans l'artefact Pages (on publie '.').
          rm -rf node_modules
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
