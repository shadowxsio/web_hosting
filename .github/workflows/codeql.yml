name: CodeQL (analyse de sécurité)

# Code écrit à la main du site : CV, courses, scripts de données et workflows.
# (TrailStrong a déménagé dans shadowxsio/trail-suite : trailstrong/ ne garde que la page de nettoyage ;
#  coach/ ne contient que des fichiers déjà construits.)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3" # mercredi 5h41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Dossiers uniquement : l'extracteur Python parcourt chaque entrée comme un répertoire.
          config: |
            paths:
              - cv
              - runs
              - scripts
              - trailstrong
              - .github/workflows
            paths-ignore:
              - coach
              - maquettes
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
